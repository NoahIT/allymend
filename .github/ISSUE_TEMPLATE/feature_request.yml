name: Feature request
description: Suggest a new check, fix or output format.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: If it's about a specific accessibility issue, link the WCAG success criterion if you know it.
    validations:
      required: true
