name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the command you ran and any error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A small HTML file or public URL that shows the problem helps most.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Allymend version
      placeholder: "0.1.0, or a commit hash"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: "Windows 11, Python 3.14"
    validations:
      required: true
